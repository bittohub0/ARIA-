name: Build ARIA Desktop (Windows & macOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish_release:
        description: 'Publish as GitHub Release?'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_script: npm run build:windows
          - os: macos-latest
            platform: mac
            build_script: npm run build:mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile and Bundle Application
        run: npm run build

      - name: Build Desktop Binaries
        run: ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-${{ matrix.platform }}-build
          path: dist-desktop/*
          if-no-files-found: warn

  release:
    name: Create GitHub Release & Publish Installers
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p final-release-assets
          find release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} final-release-assets/ \;
          echo "Release files ready for upload (Windows & macOS only):"
          ls -la final-release-assets

      - name: Determine Release Tag
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.event.inputs.release_tag }}" != "" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Release Tag: ${TAG_NAME}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ARIA Desktop Assistant ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            final-release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

