name: Build ARIA Cross-Platform Desktop

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_script: npm run build:windows
            artifact_pattern: dist-desktop/ARIA-Setup*.exe
          - os: macos-latest
            platform: mac
            build_script: npm run build:mac
            artifact_pattern: dist-desktop/ARIA*.dmg
          - os: ubuntu-latest
            platform: linux
            build_script: npm run build:linux
            artifact_pattern: dist-desktop/ARIA*.AppImage,dist-desktop/ARIA*.deb

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libpulse-dev libasound2-dev libx11-dev libxtst-dev libpng-dev

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile and Bundle Application
        run: npm run build

      - name: Build Desktop Binaries
        run: ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-${{ matrix.platform }}-build
          path: dist-desktop/*
          if-no-files-found: warn

  release:
    name: Create GitHub Release & Publish Installers
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p final-release-assets
          find release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) -exec cp {} final-release-assets/ \;
          echo "Release files ready for upload:"
          ls -la final-release-assets

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Building release for ${TAG_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ARIA Assistant ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            final-release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
