name: Build ARIA Desktop (Windows & macOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  windows-build:
    name: Build on Windows (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile and Bundle Application
        run: npm run build

      - name: Build Windows Desktop Installer
        run: npm run build:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-windows-build
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip
          if-no-files-found: error

  macos-build:
    name: Build on macOS (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile and Bundle Application
        run: npm run build

      - name: Build macOS Desktop DMG
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-macos-build
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release & Publish Installers
    needs: [windows-build, macos-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ARIA-windows-build
          path: release-artifacts/windows

      - name: Download macOS Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ARIA-macos-build
          path: release-artifacts/macos

      - name: Organize Release Assets
        run: |
          mkdir -p final-release-assets
          find release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} final-release-assets/ \;
          echo "========================================="
          echo "Release Files Ready for Publishing:"
          ls -la final-release-assets
          echo "========================================="

      - name: Determine Release Tag & Version
        id: get_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.event.inputs.release_tag }}" != "" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v${PKG_VERSION}"
          fi
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${TAG_NAME}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ARIA Desktop Assistant ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            final-release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


